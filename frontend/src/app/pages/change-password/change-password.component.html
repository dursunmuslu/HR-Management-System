<section class="change-password-page">

  <div class="password-card">

    <p class="page-eyebrow">
      Hesap Güvenliği
    </p>

    <h1>
      Şifrenizi değiştirin
    </h1>

    <p class="description">
      Hesabınız geçici şifreyle oluşturuldu.
      Sistemi kullanmaya devam etmek için
      yeni bir şifre belirlemelisiniz.
    </p>

    @if (errorMessage) {
      <div class="error-alert">
        {{ errorMessage }}
      </div>
    }

    <form
      [formGroup]="form"
      (ngSubmit)="submit()"
    >

      <label>
        <span>Mevcut geçici şifre</span>

        <div class="password-input">
          <input
            [type]="
              showCurrentPassword
                ? 'text'
                : 'password'
            "
            formControlName="current_password"
            autocomplete="current-password"
          >

          <button
            type="button"
            (click)="toggleCurrentPassword()"
          >
            {{
              showCurrentPassword
                ? 'Gizle'
                : 'Göster'
            }}
          </button>
        </div>
      </label>

      <label>
        <span>Yeni şifre</span>

        <div class="password-input">
          <input
            [type]="
              showNewPassword
                ? 'text'
                : 'password'
            "
            formControlName="new_password"
            autocomplete="new-password"
          >

          <button
            type="button"
            (click)="toggleNewPassword()"
          >
            {{
              showNewPassword
                ? 'Gizle'
                : 'Göster'
            }}
          </button>
        </div>

        @if (
          controls.new_password.invalid &&
          controls.new_password.touched
        ) {
          <small>
            Yeni şifre 8–72 karakter olmalıdır.
          </small>
        }
      </label>

      <label>
        <span>Yeni şifre tekrar</span>

        <input
          [type]="
            showNewPassword
              ? 'text'
              : 'password'
          "
          formControlName="
            new_password_confirmation
          "
          autocomplete="new-password"
        >

        @if (
          form.hasError(
            'passwordMismatch'
          ) &&
          controls
            .new_password_confirmation
            .touched
        ) {
          <small>
            Şifreler eşleşmiyor.
          </small>
        }
      </label>

      <button
        type="submit"
        class="submit-button"
        [disabled]="isSubmitting"
      >
        {{
          isSubmitting
            ? 'Değiştiriliyor...'
            : 'Şifreyi değiştir'
        }}
      </button>

      <button
        type="button"
        class="logout-button"
        (click)="logout()"
      >
        Çıkış yap
      </button>

    </form>

  </div>

</section>
